<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plaza dev harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0a1a;
        color: #e8e6f8;
        font: 12px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 8px;
        bottom: 8px;
        margin: 0;
        padding: 6px 8px;
        border-radius: 6px;
        background: rgba(11, 10, 26, 0.72);
        pointer-events: none;
        white-space: pre;
      }
      #tags div {
        position: fixed;
        left: 0;
        top: 0;
        translate: -50% -130%;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgba(11, 10, 26, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.15);
        pointer-events: none;
        white-space: nowrap;
      }
      body.clean #hud,
      body.clean #tags {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="tags"></div>
    <pre id="hud"></pre>
    <script type="module" src="/src/plaza-dev.ts"></script>
  </body>
</html>
