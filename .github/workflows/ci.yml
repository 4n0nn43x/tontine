name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: make deps
      - run: make test
      # The committed wasm comes from `make build-repro` (pinned cargo-near image); a plain cargo
      # rebuild here would not match it. Check the committed files, then run the demo on them.
      - run: make verify-wasm
      - run: make demo
      - run: make thesis
